# Database Configuration
# 支持环境变量覆盖，默认值用于本地开发
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:lost_found}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
jdbc.username=${MYSQL_USER:root}
jdbc.password=${MYSQL_PASSWORD:root123}
